# pytest.ini - pytest設定ファイル

[pytest]
# テストディレクトリ
testpaths = tests

# テストファイルのパターン
python_files = test_*.py

# テストクラスのパターン
python_classes = Test*

# テスト関数のパターン
python_functions = test_*

# 出力オプション
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# カバレッジ設定pytest-covがインストールされている場合
# --cov=pole_facility_app
# --cov-report=html
# --cov-report=term-missing

# マーカー定義
markers =
    unit: 単体テスト
    integration: 統合テスト
    qgis: QGIS環境が必要なテスト
    slow: 実行に時間がかかるテスト

# ログ設定
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 最小Pythonバージョン
minversion = 6.0
